<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Fixit Editor</title>
    <script>
      // 起動直後の一瞬も、設定の明るさに合わせた色にする
      try {
        if ("__TAURI_INTERNALS__" in window) throw 0; // アプリ版は透過のまま
        var m = (JSON.parse(localStorage.getItem("fixit:settings:v1") || "{}") || {}).mode;
        var d = m === "dark" || (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.style.background = d ? "#0e1016" : "#f4f3f1";
        document.documentElement.style.colorScheme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
