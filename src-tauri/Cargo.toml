[package]
name = "fixit-editor"
version = "0.0.1"
description = "軽くて見た目のいいコードエディタ(フィクシットエディタ)"
authors = ["Lapius"]
license-file = "../LICENSE"
edition = "2021"

[workspace]
members = ["fixit-core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fixit-core = { path = "fixit-core" }
rfd = "0.16"
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
