[package]
name = "fixit-core"
version = "0.0.1"
description = "フィクシットエディタの Rust 側の中身(ファイル操作・Claude の呼び出し)。Tauri には依存しない"
authors = ["Lapius"]
license-file = "../../LICENSE"
edition = "2021"

[dependencies]
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }
sha2 = "0.10"
base64 = "0.22"
ureq = "2"
flate2 = "1"
tar = { version = "0.4", default-features = false }
fontdb = { version = "0.23", default-features = false, features = ["std", "fs", "memmap"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
